name: Publish AMP ClubÑ AI Bot image

on:
  push:
    branches: [main]
    paths:
      - docker/clubn-ai-bot/**
      - .github/workflows/publish-clubn-ai-bot-image.yml
  pull_request:
    paths:
      - docker/clubn-ai-bot/**
      - src/clubn-ai-bot/**
      - .github/workflows/publish-clubn-ai-bot-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cjguirao/amp-clubn-ai-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        working-directory: src/clubn-ai-bot
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Shell syntax
        run: bash -n docker/clubn-ai-bot/clubn-amp-run && bash -n docker/clubn-ai-bot/clubn-amp-update

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build once into the runner, scan it, and only then publish (same cached layers).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/clubn-ai-bot/Dockerfile
          load: true
          tags: amp-clubn-ai-bot:scan
      - name: Vulnerability scan (fails on fixable critical CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amp-clubn-ai-bot:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Fail on fixable critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amp-clubn-ai-bot:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: docker/clubn-ai-bot/Dockerfile
          # pull requests only prove the image builds and passes the scan; main publishes it
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CJGuirao/AMP-Templates
            org.opencontainers.image.description=AMP-compatible image for the ClubÑ AI Discord bot (CPU-only Ollama + Python)
