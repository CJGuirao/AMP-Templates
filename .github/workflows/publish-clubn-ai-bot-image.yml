name: Publish AMP ClubÑ AI Bot image

on:
  push:
    branches: [main]
    paths:
      - docker/clubn-ai-bot/**
      - .github/workflows/publish-clubn-ai-bot-image.yml
  pull_request:
    paths:
      - docker/clubn-ai-bot/**
      - clubn-ai-bot/**
      - .github/workflows/publish-clubn-ai-bot-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cjguirao/amp-clubn-ai-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        working-directory: clubn-ai-bot
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Shell syntax
        run: bash -n docker/clubn-ai-bot/clubn-amp-run && bash -n docker/clubn-ai-bot/clubn-amp-update

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/clubn-ai-bot/Dockerfile
          # pull requests only prove the image builds; main publishes it
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CJGuirao/AMP-Templates
            org.opencontainers.image.description=AMP-compatible image for the ClubÑ AI Discord bot (CPU-only Ollama + Python)
